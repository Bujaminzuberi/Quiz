<!doctype html>
<html lang="de">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<meta
  name="theme-color"
  content="#111827"
>

<title>Quiz Training</title>


<style>

*{
  box-sizing:border-box
}


body{
  margin:0;
  font-family:
    system-ui,
    -apple-system,
    Segoe UI,
    Roboto,
    sans-serif;
  background:#f3f4f6;
  color:#111827
}


.app{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  padding:20px
}


.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}


h1{
  font-size:30px;
  margin:8px 0
}


h2{
  font-size:22px;
  margin:8px 0
}


.muted{
  color:#6b7280
}


.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 5px 20px #0000000d
}


.btn{
  width:100%;
  border:0;
  border-radius:12px;
  padding:14px 16px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  background:#111827;
  color:white;
  margin-top:12px
}


.btn.secondary{
  background:#e5e7eb;
  color:#111827
}


.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}


.option{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px;
  border:2px solid #e5e7eb;
  border-radius:12px;
  margin:10px 0;
  cursor:pointer
}


.option.selected{
  border-color:#111827;
  background:#f9fafb
}


.option input{
  margin-top:3px;
  transform:scale(1.2)
}


.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:99px;
  overflow:hidden;
  margin:15px 0
}


.bar{
  height:100%;
  background:#111827;
  width:0
}


.badge{
  display:inline-block;
  background:#e5e7eb;
  border-radius:99px;
  padding:5px 9px;
  font-size:12px;
  font-weight:700
}


.score{
  font-size:48px;
  font-weight:800;
  text-align:center;
  margin:20px 0
}


.hidden{
  display:none
}


.small{
  font-size:13px
}


.error{
  color:#dc2626;
  font-weight:600
}


.loading{
  text-align:center;
  padding:30px 10px;
  color:#6b7280
}


.status{
  font-size:12px;
  color:#6b7280;
  margin-top:8px;
  text-align:center
}

</style>

</head>


<body>


<div class="app">


  <div class="top">

    <div>

      <span class="badge">
        Quiz Training
      </span>

      <h1 id="title">
        Meine Quizze
      </h1>

    </div>

  </div>



  <!-- QUIZ AUSWAHL -->

  <section id="home">

    <p class="muted">

      Die Quizzes dürfen ausschliesslich
      für interne Zwecke im Rahmen der
      Ausbildung verwendet werden.
      Nach erfolgreichem Abschluss der
      Lehre werden sämtliche Quizzes und
      die damit verbundenen Daten gelöscht.

      <b>Bujamin.Zuberi</b>

    </p>


    <div id="quizList">

      <div class="loading">

        Fragen werden geladen ...

      </div>

    </div>


    <div
      id="status"
      class="status"
    ></div>

  </section>



  <!-- QUIZ -->

  <section id="quiz" class="hidden">


    <button
      class="btn secondary"
      onclick="showHome()"
    >

      ← Quiz Auswahl

    </button>


    <div class="card">


      <div
        class="muted"
        id="counter"
      ></div>


      <div class="progress">

        <div
          class="bar"
          id="bar"
        ></div>

      </div>


      <h2 id="question"></h2>


      <div
        class="muted small"
        id="typeHint"
      ></div>


      <div id="options"></div>


      <button
        class="btn"
        id="nextBtn"
        onclick="nextQuestion()"
        disabled
      >

        Weiter

      </button>


    </div>

  </section>



  <!-- ERGEBNIS -->

  <section id="result" class="hidden">


    <div class="card">


      <h2 id="resultTitle"></h2>


      <div
        class="score"
        id="score"
      ></div>


      <p
        id="resultText"
        class="muted"
        style="text-align:center"
      ></p>


      <div id="wrongQuestions"></div>


      <button
        class="btn"
        onclick="restart()"
      >

        Noch einmal

      </button>


      <button
        class="btn secondary"
        onclick="showHome()"
      >

        Zur Quiz Auswahl

      </button>


    </div>

  </section>


</div>



<script>


/* =========================================================
   GOOGLE SHEET
   ========================================================= */


const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVy9kNb6JPXKhhKto_6tauXelFzXS4xOP61q-kaoqzvwVAE628_hXk26SZ-QP4sVQ5j1RiqO0cxxVn/pub?gid=0&single=true&output=csv";


/* =========================================================
   CACHE
   ========================================================= */


const CACHE_KEY =
  "quiz_training_questions_v1";


/* =========================================================
   QUIZ VARIABLEN
   ========================================================= */


let QUIZZES = [];

let currentQuiz = null;

let current = 0;

let points = 0;

let selected = [];

let wrongQuestions = [];



/* =========================================================
   HTML ELEMENT
   ========================================================= */


const $ = id =>
  document.getElementById(id);



/* =========================================================
   ARRAY MISCHEN
   ========================================================= */


function shuffle(array){

  const arr = [...array];


  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [arr[i], arr[j]] =
      [arr[j], arr[i]];

  }


  return arr;

}



/* =========================================================
   CSV PARSER
   ========================================================= */


function parseCSV(text){

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for(
    let i = 0;
    i < text.length;
    i++
  ){

    const char = text[i];

    const next = text[i + 1];


    if(
      char === '"' &&
      insideQuotes &&
      next === '"'
    ){

      cell += '"';

      i++;

    }


    else if(char === '"'){

      insideQuotes =
        !insideQuotes;

    }


    else if(
      char === ',' &&
      !insideQuotes
    ){

      row.push(cell.trim());

      cell = "";

    }


    else if(
      (char === '\n' ||
       char === '\r') &&
      !insideQuotes
    ){

      if(
        char === '\r' &&
        next === '\n'
      ){

        i++;

      }


      row.push(cell.trim());

      cell = "";


      if(
        row.some(
          x => x !== ""
        )
      ){

        rows.push(row);

      }


      row = [];

    }


    else{

      cell += char;

    }

  }


  if(
    cell !== "" ||
    row.length > 0
  ){

    row.push(cell.trim());


    if(
      row.some(
        x => x !== ""
      )
    ){

      rows.push(row);

    }

  }


  return rows;

}



/* =========================================================
   GOOGLE SHEET IN QUIZZES UMWANDELN
   ========================================================= */


function buildQuizzes(csv){

  const rows =
    parseCSV(csv);


  if(rows.length < 2){

    throw new Error(
      "Das Google Sheet enthält keine Fragen."
    );

  }


  const headers =
    rows[0].map(
      x =>
        x
          .trim()
          .toLowerCase()
    );


  const quizIndex =
    headers.indexOf("quiz");

  const questionIndex =
    headers.indexOf("question");

  const typeIndex =
    headers.indexOf("type");

  const aIndex =
    headers.indexOf("a");

  const bIndex =
    headers.indexOf("b");

  const cIndex =
    headers.indexOf("c");

  const dIndex =
    headers.indexOf("d");

  const correctIndex =
    headers.indexOf("correct");

  const pointsIndex =
    headers.indexOf("points");


  if(
    quizIndex === -1 ||
    questionIndex === -1 ||
    typeIndex === -1 ||
    correctIndex === -1
  ){

    throw new Error(
      "Benötigte Spalten fehlen: quiz, question, type, correct"
    );

  }


  const questions =

    rows
      .slice(1)
      .map(row => {


        const options = [];


        if(
          aIndex !== -1 &&
          row[aIndex] &&
          row[aIndex].trim() !== ""
        ){

          options.push({

            id:"A",

            text:
              row[aIndex].trim()

          });

        }


        if(
          bIndex !== -1 &&
          row[bIndex] &&
          row[bIndex].trim() !== ""
        ){

          options.push({

            id:"B",

            text:
              row[bIndex].trim()

          });

        }


        if(
          cIndex !== -1 &&
          row[cIndex] &&
          row[cIndex].trim() !== ""
        ){

          options.push({

            id:"C",

            text:
              row[cIndex].trim()

          });

        }


        if(
          dIndex !== -1 &&
          row[dIndex] &&
          row[dIndex].trim() !== ""
        ){

          options.push({

            id:"D",

            text:
              row[dIndex].trim()

          });

        }


        const correct =

          row[correctIndex]

            ? row[correctIndex]

                .split(",")

                .map(
                  x =>
                    x
                      .trim()
                      .toUpperCase()
                )

                .filter(Boolean)

            : [];


        return {

          quiz:
            row[quizIndex]
              ? row[quizIndex].trim()
              : "",


          question:
            row[questionIndex]
              ? row[questionIndex].trim()
              : "",


          type:
            row[typeIndex]
              ? row[typeIndex]
                  .trim()
                  .toLowerCase()
              : "single",


          options: options,


          correct: correct,


          points:

            row[pointsIndex] &&
            !isNaN(
              Number(
                row[pointsIndex]
              )
            )

              ? Number(
                  row[pointsIndex]
                )

              : 1

        };

      })


      .filter(q =>

        q.quiz &&
        q.question &&
        q.options.length > 0 &&
        q.correct.length > 0

      );


  const quizMap = {};


  questions.forEach(q => {

    if(
      !quizMap[q.quiz]
    ){

      quizMap[q.quiz] = [];

    }


    quizMap[q.quiz].push({

      question:q.question,

      type:q.type,

      options:q.options,

      correct:q.correct,

      points:q.points

    });

  });


  return Object.keys(
    quizMap
  ).map(quizName => ({

    id:

      quizName
        .toLowerCase()
        .replace(
          /[^a-z0-9äöü]+/gi,
          "-"
        ),


    title:
      quizName,


    description:
      quizName +
      " – Grundlagen",


    active:true,


    questions:
      quizMap[quizName]

  }));

}



/* =========================================================
   QUIZ AUS CACHE LADEN
   ========================================================= */


function loadFromCache(){

  try{

    const cached =
      localStorage.getItem(
        CACHE_KEY
      );


    if(!cached){

      return false;

    }


    const data =
      JSON.parse(cached);


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      return false;

    }


    QUIZZES = data;


    console.log(
      "Quiz aus Cache geladen."
    );


    return true;

  }

  catch(error){

    console.warn(
      "Cache konnte nicht gelesen werden.",
      error
    );


    return false;

  }

}



/* =========================================================
   GOOGLE SHEET AKTUALISIEREN
   ========================================================= */


async function updateFromGoogle(){

  try{


    /*
     * Cache Busting:
     * verhindert, dass der Browser
     * eine alte CSV Version verwendet.
     */

    const url =
      SHEET_URL +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Google Sheet konnte nicht geladen werden."
      );

    }


    const csv =
      await response.text();


    const newQuizzes =
      buildQuizzes(csv);


    if(
      !newQuizzes.length
    ){

      throw new Error(
        "Keine gültigen Quizze gefunden."
      );

    }


    /*
     * Neue Daten übernehmen
     */

    QUIZZES =
      newQuizzes;


    /*
     * Im Browser speichern
     */

    localStorage.setItem(

      CACHE_KEY,

      JSON.stringify(
        QUIZZES
      )

    );


    console.log(
      "Google Sheet aktualisiert."
    );


    /*
     * Anzeige aktualisieren,
     * aber nur wenn wir gerade
     * auf der Startseite sind.
     */

    if(
      !$('home').classList.contains(
        'hidden'
      )
    ){

      renderHome();

    }


    $('status').textContent =
      "Fragen aktualisiert";


    setTimeout(() => {

      $('status').textContent = "";

    },3000);


  }

  catch(error){

    console.warn(
      "Google Sheet Update fehlgeschlagen:",
      error
    );


    /*
     * Wenn bereits Cache vorhanden ist,
     * müssen wir nichts weiter tun.
     */

    if(
      QUIZZES.length > 0
    ){

      $('status').textContent =
        "Offline Version verwendet";

    }

    else{

      $('quizList').innerHTML = `

        <div class="card">

          <h2>
            Fehler beim Laden
          </h2>

          <p class="muted">

            Die Fragen konnten nicht
            geladen werden.

          </p>

          <p class="small error">

            ${escapeHtml(
              error.message
            )}

          </p>

        </div>

      `;

    }

  }

}



/* =========================================================
   START
   ========================================================= */


function init(){

  /*
   * 1. Zuerst sofort Cache laden
   */

  const hasCache =
    loadFromCache();


  /*
   * Wenn Cache vorhanden ist,
   * Quiz sofort anzeigen.
   */

  if(hasCache){

    renderHome();

  }


  /*
   * 2. Google Sheet im Hintergrund
   * aktualisieren.
   */

  updateFromGoogle();

}


init();



/* =========================================================
   SEITEN WECHSELN
   ========================================================= */


function show(id){

  [
    'home',
    'quiz',
    'result'
  ]

  .forEach(x => {

    $(x).classList.toggle(
      'hidden',
      x !== id
    );

  });

}



/* =========================================================
   HOME
   ========================================================= */


function showHome(){

  show('home');

  renderHome();

}



/* =========================================================
   QUIZ AUSWAHL
   ========================================================= */


function renderHome(){

  $('title').textContent =
    'Meine Quizze';


  if(
    QUIZZES.length === 0
  ){

    $('quizList').innerHTML = `

      <div class="loading">

        Fragen werden geladen ...

      </div>

    `;

    return;

  }


  $('quizList').innerHTML =

    QUIZZES

      .filter(
        q =>
          q.active !== false
      )

      .map(q => `

        <div class="card">

          <h2>

            ${escapeHtml(
              q.title
            )}

          </h2>


          <p class="muted">

            ${escapeHtml(
              q.description || ''
            )}

          </p>


          <span class="badge">

            ${q.questions.length}
            Fragen

          </span>


          <button
            class="btn"
            onclick="startQuiz('${escapeAttr(q.id)}')"
          >

            Starten

          </button>

        </div>

      `)

      .join('');

}



/* =========================================================
   QUIZ STARTEN
   ========================================================= */


function startQuiz(id){

  const originalQuiz =
    QUIZZES.find(
      q =>
        q.id === id
    );


  if(!originalQuiz){

    return;

  }


  currentQuiz = {

    ...originalQuiz,


    questions:

      shuffle(
        originalQuiz.questions
      )

      .map(q => {


        const shuffledOptions =
          shuffle(
            q.options
          );


        const newOptions =

          shuffledOptions.map(
            (option,index) => ({

              ...option,

              id:
                String.fromCharCode(
                  65 + index
                )

            })
          );


        const newCorrect =

          shuffledOptions

            .map(
              (option,index) => ({

                oldId:
                  option.id,

                newId:
                  String.fromCharCode(
                    65 + index
                  )

              })
            )

            .filter(
              x =>
                q.correct.includes(
                  x.oldId
                )
            )

            .map(
              x =>
                x.newId
            );


        return {

          ...q,

          options:
            newOptions,

          correct:
            newCorrect

        };

      })

  };


  current = 0;

  points = 0;

  selected = [];

  wrongQuestions = [];


  $('title').textContent =
    currentQuiz.title;


  show('quiz');

  renderQuestion();

}



/* =========================================================
   FRAGE ANZEIGEN
   ========================================================= */


function renderQuestion(){

  const q =
    currentQuiz.questions[current];


  selected = [];


  $('counter').textContent =

    `Frage ${
      current + 1
    } von ${
      currentQuiz.questions.length
    }`;


  $('bar').style.width =

    (
      current /
      currentQuiz.questions.length *
      100
    ) + '%';


  $('question').textContent =
    q.question;


  $('typeHint').textContent =

    q.type === 'multi'

      ? 'Mehrere Antworten möglich'

      : 'Eine Antwort auswählen';


  $('options').innerHTML =

    q.options

      .map(
        (o,i) => `

          <label
            class="option"
            id="opt${i}"
          >

            <input

              type="${
                q.type === 'multi'
                  ? 'checkbox'
                  : 'radio'
              }"

              name="answer"

              value="${escapeAttr(
                o.id
              )}"

              onchange="choose(this)"

            >


            <span>

              <b>

                ${escapeHtml(
                  o.id
                )}.

              </b>


              ${escapeHtml(
                o.text
              )}

            </span>

          </label>

        `
      )

      .join('');


  $('nextBtn').disabled =
    true;


  $('nextBtn').textContent =

    current ===
    currentQuiz.questions.length - 1

      ? 'Ergebnis anzeigen'

      : 'Weiter';

}



/* =========================================================
   ANTWORT AUSWÄHLEN
   ========================================================= */


function choose(input){

  const q =
    currentQuiz.questions[current];


  if(
    q.type === 'multi'
  ){

    selected =

      [
        ...document.querySelectorAll(
          'input[name=answer]:checked'
        )
      ]

      .map(
        x =>
          x.value
      );

  }

  else{

    selected = [
      input.value
    ];

  }


  document

    .querySelectorAll(
      '.option'
    )

    .forEach(
      (el,i) => {

        const id =
          q.options[i].id;


        el.classList.toggle(

          'selected',

          selected.includes(
            id
          )

        );

      }
    );


  $('nextBtn').disabled =
    selected.length === 0;

}



/* =========================================================
   NÄCHSTE FRAGE
   ========================================================= */


function nextQuestion(){

  const q =
    currentQuiz.questions[current];


  const correct =
    [...q.correct].sort();


  const chosen =
    [...selected].sort();


  const ok =

    correct.length ===
    chosen.length &&

    correct.every(
      (x,i) =>
        x === chosen[i]
    );


  if(ok){

    points +=
      q.points || 1;

  }

  else{

    wrongQuestions.push({

      question:
        q.question,

      options:
        q.options,

      correct:
        q.correct,

      selected:
        [...selected]

    });

  }


  current++;


  if(
    current >=
    currentQuiz.questions.length
  ){

    showResult();

  }

  else{

    renderQuestion();

  }

}



/* =========================================================
   ERGEBNIS
   ========================================================= */


function showResult(){

  show('result');


  const max =

    currentQuiz.questions.reduce(

      (sum,q) =>
        sum + (q.points || 1),

      0

    );


  const pct =

    max

      ? Math.round(
          points / max * 100
        )

      : 0;


  $('resultTitle').textContent =

    currentQuiz.title +
    ' abgeschlossen';


  $('score').textContent =

    `${points} / ${max}`;


  $('resultText').textContent =

    `${pct}% richtig.`;



  /*
   * Alles richtig
   */

  if(
    wrongQuestions.length === 0
  ){

    $('wrongQuestions').innerHTML = `

      <div class="card">

        <h2>
          🎉 Alles richtig!
        </h2>

        <p class="muted">

          Du hast alle Fragen
          richtig beantwortet.

        </p>

      </div>

    `;

    return;

  }



  /*
   * Falsche Fragen
   */

  $('wrongQuestions').innerHTML = `

    <div class="card">

      <h2>
        Falsch beantwortete Fragen
      </h2>


      ${
        wrongQuestions

          .map(
            (item,index) => `

              <div

                style="
                  border:2px solid #fee2e2;
                  background:#fef2f2;
                  border-radius:12px;
                  padding:14px;
                  margin:12px 0;
                "

              >


                <b>

                  ${index + 1}.
                  ${escapeHtml(
                    item.question
                  )}

                </b>


                <p class="small">

                  Deine Antwort:

                  <strong>

                    ${
                      item.selected.length

                        ? item.selected

                            .map(
                              id => {

                                const option =
                                  item.options.find(
                                    o =>
                                      o.id === id
                                  );


                                return option

                                  ? escapeHtml(
                                      id +
                                      '. ' +
                                      option.text
                                    )

                                  : escapeHtml(
                                      id
                                    );

                              }
                            )

                            .join(', ')

                        : 'Keine Antwort'
                    }

                  </strong>

                </p>


                <p class="small">

                  Richtige Antwort:

                  <strong>

                    ${
                      item.correct

                        .map(
                          id => {

                            const option =
                              item.options.find(
                                o =>
                                  o.id === id
                              );


                            return option

                              ? escapeHtml(
                                  id +
                                  '. ' +
                                  option.text
                                )

                              : escapeHtml(
                                  id
                                );

                          }
                        )

                        .join(', ')

                    }

                  </strong>

                </p>


              </div>

            `
          )

          .join('')
      }


    </div>

  `;

}



/* =========================================================
   NEU STARTEN
   ========================================================= */


function restart(){

  startQuiz(
    currentQuiz.id
  );

}



/* =========================================================
   HTML SICHER ESCAPEN
   ========================================================= */


function escapeHtml(s){

  return String(s).replace(

    /[&<>"']/g,

    m => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#039;'
