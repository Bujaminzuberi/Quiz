<style>

.bar{

  display:none
}

.small{

}

.error{

}

.loading{
  text-align:center;
  padding:30px 10px;
  color:#6b7280
}

.status{
  font-size:12px;
  color:#6b7280;
  margin-top:8px;
  text-align:center
}

  width:100%;
  min-height:150px;
  resize:vertical;
  border:2px solid #e5e7eb;
  border-radius:12px;
  padding:14px;
  font-family:inherit;
  font-size:16px;
  line-height:1.5;
  outline:none
}

textarea:focus{
  border-color:#111827
}


/* =====================================================
   ZUORDNUNG
   ===================================================== */

.matching-list{
  margin-top:14px
}

.matching-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid #e5e7eb
}

  font-weight:700;
  font-size:15px;
  line-height:1.3;
}

.matching-input{
 width:48px;
  height:38px;
  padding:0;
  text-align:center;
  text-transform:uppercase;
  font-size:16px;
  font-weight:800;
  border:2px solid #e5e7eb;
  border-radius:8px;
  outline:none
}

.matching-input:focus{
  border-color:#111827
}

.matching-answers{
  margin-top:16px;
  padding:12px;
  background:#f9fafb;
  border-radius:10px
}

.matching-answers h3{
  font-size:16px;
  margin:4px 0 8px
}

.matching-answer{
  padding:5px 0;
  line-height:1.3;
  font-size:14px
}
  
.matching-letter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:26px;
  height:26px;
  margin-right:6px;
  background:#e5e7eb;
  border-radius:6px;
  font-size:13px;
  font-weight:800
}



/* =====================================================
   ERGEBNIS
   ===================================================== */

.result-box{
  border-radius:12px;
  padding:14px;
  margin:12px 0
}

.result-wrong{
  border:2px solid #fecaca;
  background:#fef2f2
}

.result-open{
  border:2px solid #fde68a;
  background:#fffbeb
}

.result-correct{
  border:2px solid #bbf7d0;
  background:#f0fdf4
}

.answer-label{
  font-size:13px;
  color:#6b7280;
  margin-bottom:4px
}

.answer-text{
  margin:4px 0 12px;
  font-weight:600;
  white-space:pre-wrap
}

.result-match{
  padding:8px 0;
  border-top:1px solid #fecaca
}

@media(max-width:600px){

   grid-template-columns:minmax(0,1fr) 44px;
    gap:6px;
    padding:7px 0;
  }

  .matching-term{
    font-size:14px;
  }

  .matching-input{
    width:44px;
    height:36px;
    font-size:15px;
    border-radius:7px;
  }

  .matching-answers{
    margin-top:12px;
    padding:10px;
  }

  .matching-answer{
    font-size:13px;
    padding:4px 0;
  }

  .matching-letter{
    width:24px;
    height:24px;
    margin-right:5px;
    font-size:12px;
  }

}

</style>

<body>


<div class="app">


  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div class="top">

    <div>

      <span class="badge">
        Quiz Training
      </span>

      <h1 id="title">
        Meine Quizze
      </h1>

    </div>

  </div>


  <!-- =====================================================
       QUIZ AUSWAHL
       ===================================================== -->

  <section id="home">

    <p class="muted">

      Die Quizzes dürfen ausschliesslich für interne Zwecke
      im Rahmen der Ausbildung verwendet werden.
      Nach erfolgreichem Abschluss der Lehre werden
      sämtliche Quizzes und die damit verbundenen Daten gelöscht.

      <b>Bujamin.Zuberi</b>

    </p>


    <div id="quizList">

      <div class="loading">
        Fragen werden geladen ...
      </div>

    </div>


    <div
      id="status"
      class="status"
    ></div>

  </section>


  <!-- =====================================================
       QUIZ
       ===================================================== -->

  <section id="quiz" class="hidden">


    <button
      class="btn secondary"
      onclick="showHome()"
    >
      ← Quiz Auswahl
    </button>


    <div class="card">


      <div
        class="muted"
        id="counter"
      ></div>


      <div class="progress">

        <div
          class="bar"
          id="bar"
        ></div>

      </div>


      <h2 id="question"></h2>


      <div
        class="muted small"
        id="typeHint"
      ></div>


      <div id="options"></div>


      <button
        class="btn"
        id="nextBtn"
        onclick="nextQuestion()"
        disabled
      >
        Weiter
      </button>


    </div>

  </section>


  <!-- =====================================================
       ERGEBNIS
       ===================================================== -->

  <section id="result" class="hidden">


    <div class="card">


      <h2 id="resultTitle"></h2>


      <div
        class="score"
        id="score"
      ></div>


      <p
        id="resultText"
        class="muted"
        style="text-align:center"
      ></p>


      <div id="wrongQuestions"></div>


      <button
        class="btn"
        onclick="restart()"
      >
        Noch einmal
      </button>


      <button
        class="btn secondary"
        onclick="showHome()"
      >
        Zur Quiz Auswahl
      </button>


    </div>

  </section>


</div>



<script>


/* =========================================================
   GOOGLE SHEET
   ========================================================= */

const SHEET_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRVy9kNb6JPXKhhKto_6tauXelFzXS4xOP61q-kaoqzvwVAE628_hXk26SZ-QP4sVQ5j1RiqO0cxxVn/pub?gid=0&single=true&output=csv";


/* =========================================================
   CACHE
   ========================================================= */

const CACHE_KEY =
  "quiz_training_questions_v2";


/* =========================================================
   QUIZ VARIABLEN
   ========================================================= */

let QUIZZES = [];

let currentQuiz = null;

let current = 0;

let points = 0;

let selected = [];

let wrongQuestions = [];

let openQuestions = [];


/* =========================================================
   HTML ELEMENT
   ========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   ARRAY MISCHEN
   ========================================================= */

function shuffle(array){

  const arr = [...array];

  for(
    let i = arr.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [arr[i],arr[j]] =
      [arr[j],arr[i]];

  }

  return arr;

}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text){

  const rows = [];

  let row = [];

  let cell = "";

  let insideQuotes = false;


  for(
    let i = 0;
    i < text.length;
    i++
  ){

    const char = text[i];

    const next = text[i + 1];


    if(
      char === '"' &&
      insideQuotes &&
      next === '"'
    ){

      cell += '"';

      i++;

    }


    else if(char === '"'){

      insideQuotes =
        !insideQuotes;

    }


    else if(
      char === ',' &&
      !insideQuotes
    ){

      row.push(
        cell.trim()
      );

      cell = "";

    }


    else if(
      (char === '\n' ||
       char === '\r') &&
      !insideQuotes
    ){

      if(
        char === '\r' &&
        next === '\n'
      ){

        i++;

      }


      row.push(
        cell.trim()
      );

      cell = "";


      if(
        row.some(
          x => x !== ""
        )
      ){

        rows.push(row);

      }


      row = [];

    }


    else{

      cell += char;

    }

  }


  if(
    cell !== "" ||
    row.length > 0
  ){

    row.push(
      cell.trim()
    );


    if(
      row.some(
        x => x !== ""
      )
    ){

      rows.push(row);

    }

  }


  return rows;

}


/* =========================================================
   GOOGLE SHEET IN QUIZZES UMWANDELN
   ========================================================= */

function buildQuizzes(csv){

  const rows =
    parseCSV(csv);


  if(rows.length < 2){

    throw new Error(
      "Das Google Sheet enthält keine Fragen."
    );

  }


  const headers =
    rows[0].map(
      x =>
        x.trim().toLowerCase()
    );


  const quizIndex =
    headers.indexOf("quiz");

  const questionIndex =
    headers.indexOf("question");

  const typeIndex =
    headers.indexOf("type");

  const aIndex =
    headers.indexOf("a");

  const bIndex =
    headers.indexOf("b");

  const cIndex =
    headers.indexOf("c");

  const dIndex =
    headers.indexOf("d");

  const eIndex =
    headers.indexOf("e");

  const correctIndex =
    headers.indexOf("correct");

  const pointsIndex =
    headers.indexOf("points");


  /*
   * Zuordnungsspalten
   */

  const matchAIndex =
    headers.indexOf("matcha");

  const matchBIndex =
    headers.indexOf("matchb");

  const matchCIndex =
    headers.indexOf("matchc");

  const matchDIndex =
    headers.indexOf("matchd");

  const matchEIndex =
    headers.indexOf("matche");


  if(
    quizIndex === -1 ||
    questionIndex === -1 ||
    typeIndex === -1 ||
    correctIndex === -1
  ){

    throw new Error(
      "Benötigte Spalten fehlen: quiz, question, type, correct"
    );

  }


  const questions =

    rows
      .slice(1)
      .map(row => {


        const type =
          row[typeIndex]
            ? row[typeIndex]
                .trim()
                .toLowerCase()
            : "single";


        /*
         * Normale Antwortmöglichkeiten
         */

        const options = [];


        const normalColumns = [
          [aIndex,"A"],
          [bIndex,"B"],
          [cIndex,"C"],
          [dIndex,"D"],
          [eIndex,"E"]
        ];


        normalColumns.forEach(
          ([index,id]) => {

            if(
              index !== -1 &&
              row[index] &&
              row[index].trim() !== ""
            ){

              options.push({

                id:id,

                text:
                  row[index].trim()

              });

            }

          }
        );


        /*
         * Richtige Antworten
         */

        const correct =

          row[correctIndex]

            ? row[correctIndex]
                .split(",")
                .map(
                  x =>
                    x
                      .trim()
                      .toUpperCase()
                )
                .filter(Boolean)

            : [];


        /*
         * Zuordnungsdaten
         */

        const matching = [];


        if(
          type === "matching"
        ){

          const terms = [

            [aIndex,matchAIndex],

            [bIndex,matchBIndex],

            [cIndex,matchCIndex],

            [dIndex,matchDIndex],

            [eIndex,matchEIndex]

          ];


          terms.forEach(
            ([termIndex,matchIndex]) => {

              if(
                termIndex !== -1 &&
                matchIndex !== -1 &&
                row[termIndex] &&
                row[matchIndex]
              ){

                matching.push({

                  id:
                    String.fromCharCode(
                      65 +
                      matching.length
                    ),

                  term:
                    row[termIndex].trim(),

                  answer:
                    row[matchIndex].trim()

                });

              }

            }
          );

        }


        return {

          quiz:
            row[quizIndex]
              ? row[quizIndex].trim()
              : "",


          question:
            row[questionIndex]
              ? row[questionIndex].trim()
              : "",


          type:type,


          options:options,


          correct:correct,


          matching:matching,


          points:

            row[pointsIndex] &&
            !isNaN(
              Number(
                row[pointsIndex]
              )
            )

              ? Number(
                  row[pointsIndex]
                )

              : 1

        };

      })


      .filter(q =>

        q.quiz &&
        q.question &&

        (
          q.type === "open" ||

          q.type === "matching" ||

          (
            q.options.length > 0 &&
            q.correct.length > 0
          )
        )

      );


  const quizMap = {};


  questions.forEach(q => {

    if(
      !quizMap[q.quiz]
    ){

      quizMap[q.quiz] = [];

    }


    quizMap[q.quiz].push(q);

  });


  return Object.keys(
    quizMap
  ).map(quizName => ({

    id:

      quizName
        .toLowerCase()
        .replace(
          /[^a-z0-9äöü]+/gi,
          "-"
        ),


    title:
      quizName,


    description:
      quizName +
      " – Grundlagen",


    active:true,


    questions:
      quizMap[quizName]

  }));

}


/* =========================================================
   CACHE LADEN
   ========================================================= */

function loadFromCache(){

  try{

    const cached =
      localStorage.getItem(
        CACHE_KEY
      );


    if(!cached){

      return false;

    }


    const data =
      JSON.parse(cached);


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      return false;

    }


    QUIZZES = data;


    return true;

  }

  catch(error){

    console.warn(
      "Cache konnte nicht gelesen werden.",
      error
    );


    return false;

  }

}


/* =========================================================
   GOOGLE SHEET AKTUALISIEREN
   ========================================================= */

async function updateFromGoogle(){

  try{

    const url =
      SHEET_URL +
      "&t=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    if(!response.ok){

      throw new Error(
        "Google Sheet konnte nicht geladen werden."
      );

    }


    const csv =
      await response.text();


    const newQuizzes =
      buildQuizzes(csv);


    if(
      !newQuizzes.length
    ){

      throw new Error(
        "Keine gültigen Quizze gefunden."
      );

    }


    QUIZZES =
      newQuizzes;


    localStorage.setItem(
      CACHE_KEY,
      JSON.stringify(QUIZZES)
    );


    if(
      !$('home').classList.contains(
        'hidden'
      )
    ){

      renderHome();

    }


    $('status').textContent =
      "Fragen aktualisiert";


    setTimeout(() => {

      $('status').textContent = "";

    },3000);


  }

  catch(error){

    console.warn(
      "Google Sheet Update fehlgeschlagen:",
      error
    );


    if(
      QUIZZES.length > 0
    ){

      $('status').textContent =
        "Gespeicherte Version verwendet";

    }

    else{

      $('quizList').innerHTML = `

        <div class="card">

          <h2>
            Fehler beim Laden
          </h2>

          <p class="muted">

            Die Fragen konnten nicht
            geladen werden.

          </p>

          <p class="small error">

            ${escapeHtml(
              error.message
            )}

          </p>

        </div>

      `;

    }

  }

}


/* =========================================================
   START
   ========================================================= */

function init(){

  const hasCache =
    loadFromCache();


  if(hasCache){

    renderHome();

  }


  updateFromGoogle();

}


init();


/* =========================================================
   SEITEN WECHSELN
   ========================================================= */

function show(id){

  [
    'home',
    'quiz',
    'result'
  ]

  .forEach(x => {

    $(x).classList.toggle(
      'hidden',
      x !== id
    );

  });

}


/* =========================================================
   HOME
   ========================================================= */

function showHome(){

  show('home');

  renderHome();

}


/* =========================================================
   QUIZ AUSWAHL
   ========================================================= */

function renderHome(){

  $('title').textContent =
    'Meine Quizze';


  if(
    QUIZZES.length === 0
  ){

    $('quizList').innerHTML = `

      <div class="loading">

        Fragen werden geladen ...

      </div>

    `;

    return;

  }


  $('quizList').innerHTML =

    QUIZZES

      .filter(
        q =>
          q.active !== false
      )

      .map(q => `

        <div class="card">

          <h2>

            ${escapeHtml(
              q.title
            )}

          </h2>


          <p class="muted">

            ${escapeHtml(
              q.description || ''
            )}

          </p>


          <span class="badge">

            ${q.questions.length}
            Fragen

          </span>


          <button
            class="btn"
            onclick="startQuiz('${escapeAttr(q.id)}')"
          >

            Starten

          </button>

        </div>

      `)

      .join('');

}


/* =========================================================
   QUIZ STARTEN
   ========================================================= */

function startQuiz(id){

  const originalQuiz =
    QUIZZES.find(
      q =>
        q.id === id
    );


  if(!originalQuiz){

    return;

  }


  currentQuiz = {

    ...originalQuiz,


    questions:

      shuffle(
        originalQuiz.questions
      )

      .map(q => {


        /*
         * OFFENE FRAGE
         */

        if(
          q.type === "open"
        ){

          return {

            ...q

          };

        }


        /*
         * ZUORDNUNGSFRAGE
         */

        if(
          q.type === "matching"
        ){

          return {

            ...q,

            matching:
              q.matching.map(
                item => ({
                  ...item
                })
              )

          };

        }


        /*
         * SINGLE / MULTI
         */

        const shuffledOptions =
          shuffle(
            q.options
          );


        const newOptions =

          shuffledOptions.map(
            (option,index) => ({

              ...option,

              id:
                String.fromCharCode(
                  65 + index
                )

            })
          );


        const newCorrect =

          shuffledOptions

            .map(
              (option,index) => ({

                oldId:
                  option.id,

                newId:
                  String.fromCharCode(
                    65 + index
                  )

              })
            )

            .filter(
              x =>
                q.correct.includes(
                  x.oldId
                )
            )

            .map(
              x =>
                x.newId
            );


        return {

          ...q,

          options:
            newOptions,

          correct:
            newCorrect

        };

      })

  };


  current = 0;

  points = 0;

  selected = [];

  wrongQuestions = [];

  openQuestions = [];


  $('title').textContent =
    currentQuiz.title;


  show('quiz');

  renderQuestion();

}


/* =========================================================
   FRAGE ANZEIGEN
   ========================================================= */

function renderQuestion(){

  const q =
    currentQuiz.questions[current];


  selected = [];


  $('counter').textContent =

    `Frage ${
      current + 1
    } von ${
      currentQuiz.questions.length
    }`;


  $('bar').style.width =

    (
      current /
      currentQuiz.questions.length *
      100
    ) + '%';


  $('question').textContent =
    q.question;


  $('nextBtn').textContent =

    current ===
    currentQuiz.questions.length - 1

      ? 'Ergebnis anzeigen'

      : 'Weiter';


  /*
   * OFFENE FRAGE
   */

  if(
    q.type === "open"
  ){

    $('typeHint').textContent =
      "Offene Frage";


    $('options').innerHTML = `

      <textarea
        id="openAnswer"
        placeholder="Schreibe deine Antwort hier ..."
        oninput="checkOpenAnswer()"
      ></textarea>

    `;


    $('nextBtn').disabled =
      true;


    return;

  }


  /*
   * ZUORDNUNGSFRAGE
   */

  if(
    q.type === "matching"
  ){

    $('typeHint').textContent =
      "Schreibe den Buchstaben der richtigen Antwort in das Feld";


    /*
     * Antwortmöglichkeiten mischen
     */

    const answers =
      shuffle(
        q.matching
      );


    /*
     * Buchstaben A, B, C usw.
     * für die gemischten Antworten
     */

    const answerMap =
      answers.map(
        (item,index) => ({

          letter:
            String.fromCharCode(
              65 + index
            ),

          answer:
            item.answer,

          originalId:
            item.id

        })
      );


    /*
     * Für diese Frage speichern,
     * damit später bewertet werden kann.
     */

    q.answerMap =
      answerMap;


    /*
     * Begriffe anzeigen
     */

    let html = `

      <div class="matching-list">

    `;


    q.matching.forEach(
      (item,index) => {

        html += `

          <div class="matching-row">

            <div class="matching-term">

              ${escapeHtml(
                item.term
              )}

            </div>


            <input

              class="matching-input"

              type="text"

              maxlength="1"

              autocomplete="off"

              data-index="${index}"

              oninput="handleMatchingInput(this)"

            >

          </div>

        `;

      }
    );


    html += `

      </div>


      <div class="matching-answers">

        <h3>

          Antwortmöglichkeiten

        </h3>

    `;


    answerMap.forEach(
      item => {

        html += `

          <div class="matching-answer">

            <span class="matching-letter">

              ${item.letter}

            </span>

            ${escapeHtml(
              item.answer
            )}

          </div>

        `;

      }
    );


    html += `

      </div>

    `;


    $('options').innerHTML =
      html;


    $('nextBtn').disabled =
      true;


    return;

  }


  /*
   * SINGLE / MULTI
   */

  $('typeHint').textContent =

    q.type === 'multi'

      ? 'Mehrere Antworten möglich'

      : 'Eine Antwort auswählen';


  $('options').innerHTML =

    q.options

      .map(
        (o,i) => `

          <label
            class="option"
            id="opt${i}"
          >

            <input

              type="${
                q.type === 'multi'
                  ? 'checkbox'
                  : 'radio'
              }"

              name="answer"

              value="${escapeAttr(
                o.id
              )}"

              onchange="choose(this)"

            >


            <span>

              <b>

                ${escapeHtml(
                  o.id
                )}.

              </b>


              ${escapeHtml(
                o.text
              )}

            </span>

          </label>

        `
      )

      .join('');


  $('nextBtn').disabled =
    true;

}


/* =========================================================
   ZUORDNUNG EINGABE
   ========================================================= */

function handleMatchingInput(input){

  input.value =
    input.value
      .toUpperCase()
      .replace(
        /[^A-Z]/g,
        ""
      )
      .slice(0,1);


  const inputs =
    [
      ...document.querySelectorAll(
        '.matching-input'
      )
    ];


  const allFilled =
    inputs.every(
      x =>
        x.value.trim() !== ""
    );


  /*
   * Prüfen, ob nur gültige Buchstaben
   * verwendet wurden.
   */

  const q =
    currentQuiz.questions[current];


  const validLetters =
    q.answerMap.map(
      x =>
        x.letter
    );


  const allValid =
    inputs.every(
      x =>
        validLetters.includes(
          x.value
        )
    );


  $('nextBtn').disabled =
    !allFilled ||
    !allValid;

}



/* =========================================================
   OFFENE FRAGE
   ========================================================= */

function checkOpenAnswer(){

  const input =
    $('openAnswer');


  if(!input){

    return;

  }


  $('nextBtn').disabled =

    input.value.trim().length === 0;

}



/* =========================================================
   SINGLE / MULTI
   ========================================================= */

function choose(input){

  const q =
    currentQuiz.questions[current];


  if(
    q.type === 'multi'
  ){

    selected =

      [
        ...document.querySelectorAll(
          'input[name=answer]:checked'
        )
      ]

      .map(
        x =>
          x.value
      );

  }

  else{

    selected = [
      input.value
    ];

  }


  document

    .querySelectorAll(
      '.option'
    )

    .forEach(
      (el,i) => {

        const id =
          q.options[i].id;


        el.classList.toggle(

          'selected',

          selected.includes(
            id
          )

        );

      }
    );


  $('nextBtn').disabled =
    selected.length === 0;

}



/* =========================================================
   NÄCHSTE FRAGE
   ========================================================= */

function nextQuestion(){

  const q =
    currentQuiz.questions[current];


  /*
   * OFFENE FRAGE
   */

  if(
    q.type === "open"
  ){

    const answer =
      $('openAnswer')
        ? $('openAnswer')
            .value
            .trim()
        : "";


    openQuestions.push({

      question:
        q.question,

      answer:
        answer,

      correct:
        q.correct.join(", "),

      points:
        q.points || 1

    });


    current++;


    if(
      current >=
      currentQuiz.questions.length
    ){

      showResult();

    }

    else{

      renderQuestion();

    }


    return;

  }


  /*
   * ZUORDNUNGSFRAGE
   */

  if(
    q.type === "matching"
  ){

    const inputs =
      [
        ...document.querySelectorAll(
          '.matching-input'
        )
      ];


    let correctCount = 0;


    const userMatches = [];


    q.matching.forEach(
      (item,index) => {

        const chosenLetter =
          inputs[index]
            ? inputs[index]
                .value
                .toUpperCase()
            : "";


        const selectedAnswer =
          q.answerMap.find(
            x =>
              x.letter ===
              chosenLetter
          );


        const chosenText =
          selectedAnswer
            ? selectedAnswer.answer
            : "";


        const isCorrect =

          selectedAnswer &&
          selectedAnswer.originalId ===
          item.id;


        if(isCorrect){

          correctCount++;

        }


        userMatches.push({

          term:
            item.term,

          chosen:
            chosenText,

          chosenLetter:
            chosenLetter,

          correct:
            item.answer

        });

      }
    );


    points +=
      correctCount;


    if(
      correctCount <
      q.matching.length
    ){

      wrongQuestions.push({

        type:"matching",

        question:
          q.question,

        matches:
          userMatches,

        points:
          correctCount,

        maxPoints:
          q.matching.length

      });

    }


    current++;


    if(
      current >=
      currentQuiz.questions.length
    ){

      showResult();

    }

    else{

      renderQuestion();

    }


    return;

  }


  /*
   * SINGLE / MULTI
   */

  const correct =
    [...q.correct].sort();


  const chosen =
    [...selected].sort();


  const ok =

    correct.length ===
    chosen.length &&

    correct.every(
      (x,i) =>
        x === chosen[i]
    );


  if(ok){

    points +=
      q.points || 1;

  }

  else{

    wrongQuestions.push({

      type:"choice",

      question:
        q.question,

      options:
        q.options,

      correct:
        q.correct,

      selected:
        [...selected]

    });

  }


  current++;


  if(
    current >=
    currentQuiz.questions.length
  ){

    showResult();

  }

  else{

    renderQuestion();

  }

}



/* =========================================================
   ERGEBNIS
   ========================================================= */

function showResult(){

  show('result');


  /*
   * Automatische maximale Punkte
   */

  const automaticMax =

    currentQuiz.questions.reduce(

      (sum,q) => {

        if(
          q.type === "open"
        ){

          return sum;

        }


        if(
          q.type === "matching"
        ){

          return (
            sum +
            q.matching.length
          );

        }


        return (
          sum +
          (q.points || 1)
        );

      },

      0

    );


  const pct =

    automaticMax

      ? Math.round(
          points /
          automaticMax *
          100
        )

      : 0;


  $('resultTitle').textContent =

    currentQuiz.title +
    ' abgeschlossen';


  $('score').textContent =

    `${points} / ${automaticMax}`;


  if(
    openQuestions.length > 0
  ){

    $('resultText').textContent =

      `${pct}% automatisch richtig. ` +
      `${openQuestions.length} offene ` +
      `Frage(n) müssen manuell bewertet werden.`;

  }

  else{

    $('resultText').textContent =

      `${pct}% richtig.`;

  }


  renderWrongQuestions();

}



/* =========================================================
   FALSCHE FRAGEN
   ========================================================= */

function renderWrongQuestions(){

  let html = "";


  /*
   * SINGLE / MULTI
   */

  wrongQuestions

    .filter(
      item =>
        item.type === "choice"
    )

    .forEach(
      item => {

        html += `

          <div class="result-box result-wrong">

            <h3>

              ❌ Falsche Frage

            </h3>


            <p>

              <b>

                ${escapeHtml(
                  item.question
                )}

              </b>

            </p>


            <div class="answer-label">

              Deine Antwort

            </div>


            <div class="answer-text">

              ${
                item.selected.length

                  ? item.selected

                      .map(
                        id => {

                          const option =
                            item.options.find(
                              o =>
                                o.id === id
                            );


                          return option

                            ? escapeHtml(
                                id +
                                ". " +
                                option.text
                              )

                            : escapeHtml(
                                id
                              );

                        }
                      )

                      .join(", ")

                  : "Keine Antwort"
              }

            </div>


            <div class="answer-label">

              Richtige Antwort

            </div>


            <div class="answer-text">

              ${
                item.correct

                  .map(
                    id => {

                      const option =
                        item.options.find(
                          o =>
                            o.id === id
                        );


                      return option

                        ? escapeHtml(
                            id +
                            ". " +
                            option.text
                          )

                        : escapeHtml(
                            id
                          );

                    }
                  )

                  .join(", ")

              }

            </div>

          </div>

        `;

      }
    );



  /*
   * ZUORDNUNGSFRAGEN
   */

  wrongQuestions

    .filter(
      item =>
        item.type === "matching"
    )

    .forEach(
      item => {

        html += `

          <div class="result-box result-wrong">

            <h3>

              ❌ Zuordnungsfrage

            </h3>


            <p>

              <b>

                ${escapeHtml(
                  item.question
                )}

              </b>

            </p>


            <p class="small">

              ${item.points}
              von
              ${item.maxPoints}
              Zuordnungen richtig.

            </p>


            ${
              item.matches

                .map(
                  match => `

                    <div class="result-match">

                      <b>

                        ${escapeHtml(
                          match.term
                        )}

                      </b>

                      →

                      ${
                        match.chosen

                          ? escapeHtml(
                              match.chosenLetter +
                              " " +
                              match.chosen
                            )

                          : "Keine Antwort"

                      }


                      ${
                        match.chosen ===
                        match.correct

                          ? " ✅"

                          : `

                            ❌

                            <br>

                            <span class="small">

                              Richtig:

                              ${escapeHtml(
                                match.correct
                              )}

                            </span>

                          `

                      }

                    </div>

                  `
                )

                .join('')
            }

          </div>

        `;

      }
    );



  /*
   * OFFENE FRAGEN
   */

  openQuestions.forEach(
    item => {

      html += `

        <div class="result-box result-open">

          <h3>

            ✍️ Offene Frage

          </h3>


          <p>

            <b>

              ${escapeHtml(
                item.question
              )}

            </b>

          </p>


          <div class="answer-label">

            Deine Antwort

          </div>


          <div class="answer-text">

            ${
              item.answer

                ? escapeHtml(
                    item.answer
                  )

                : "Keine Antwort"
            }

          </div>


          <div class="answer-label">

            Musterlösung

          </div>


          <div class="answer-text">

            ${
              item.correct

                ? escapeHtml(
                    item.correct
                  )

                : "Keine Musterlösung hinterlegt."

            }

          </div>


          <span class="badge">

            Manuell bewerten

          </span>

        </div>

      `;

    }
  );



  /*
   * Alles richtig
   */

  if(
    wrongQuestions.length === 0 &&
    openQuestions.length === 0
  ){

    html = `

      <div class="result-box result-correct">

        <h3>

          🎉 Alles richtig!

        </h3>


        <p class="muted">

          Du hast alle automatisch
          bewertbaren Fragen richtig beantwortet.

        </p>

      </div>

    `;

  }


  $('wrongQuestions').innerHTML =
    html;

}



/* =========================================================
   NEU STARTEN
   ========================================================= */

function restart(){

  startQuiz(
    currentQuiz.id
  );

}



/* =========================================================
   HTML SICHER ESCAPEN
   ========================================================= */

function escapeHtml(s){

  return String(s).replace(

    /[&<>"']/g,

    m => ({

      '&':'&amp;',

      '<':'&lt;',

      '>':'&gt;',

      '"':'&quot;',

      "'":'&#039;'

    }[m])

  );

}


function escapeAttr(s){

  return escapeHtml(s);

}


</script>
