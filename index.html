<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Quiz Training</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:720px;margin:auto;min-height:100vh;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:30px;margin:8px 0}h2{font-size:22px;margin:8px 0}.muted{color:#6b7280}
.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000d}
.btn{width:100%;border:0;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#111827;color:white;margin-top:12px}
.btn.secondary{background:#e5e7eb;color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}
.option{display:flex;align-items:flex-start;gap:12px;padding:14px;border:2px solid #e5e7eb;border-radius:12px;margin:10px 0;cursor:pointer}
.option.selected{border-color:#111827;background:#f9fafb}.option input{margin-top:3px;transform:scale(1.2)}
.progress{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:15px 0}.bar{height:100%;background:#111827;width:0}
.badge{display:inline-block;background:#e5e7eb;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700}
.score{font-size:48px;font-weight:800;text-align:center;margin:20px 0}
.hidden{display:none}.row{display:flex;gap:10px}.row .btn{flex:1}
.small{font-size:13px}.correct{border-color:#16a34a!important;background:#f0fdf4}.wrong{border-color:#dc2626!important;background:#fef2f2}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><span class="badge">Quiz Training</span><h1 id="title">Meine Quizze</h1></div></div>

  <section id="home">
    <p class="muted">Wähle ein Quiz. Weitere Quizze und Fragen können später in der Datei <b>quizzes.js</b> ergänzt werden.</p>
    <div id="quizList"></div>
  </section>

  <section id="quiz" class="hidden">
    <button class="btn secondary" onclick="showHome()">← Quiz-Auswahl</button>
    <div class="card">
      <div class="muted" id="counter"></div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <h2 id="question"></h2>
      <div class="muted small" id="typeHint"></div>
      <div id="options"></div>
      <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>Weiter</button>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="card">
      <h2 id="resultTitle"></h2>
      <div class="score" id="score"></div>
      <p id="resultText" class="muted" style="text-align:center"></p>
      <button class="btn" onclick="restart()">Noch einmal</button>
      <button class="btn secondary" onclick="showHome()">Zur Quiz-Auswahl</button>
    </div>
  </section>
</div>

<script src="quizzes.js"></script>
<script>
let currentQuiz=null,current=0,points=0,selected=[];
const $=id=>document.getElementById(id);

function show(id){['home','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function showHome(){show('home');renderHome();}

function renderHome(){
  $('title').textContent='Meine Quizze';
  $('quizList').innerHTML=QUIZZES.filter(q=>q.active!==false).map(q=>`
    <div class="card">
      <h2>${escapeHtml(q.title)}</h2>
      <p class="muted">${escapeHtml(q.description||'')}</p>
      <span class="badge">${q.questions.length} Fragen</span>
      <button class="btn" onclick="startQuiz('${q.id}')">Starten</button>
    </div>`).join('');
}
function startQuiz(id){
  currentQuiz=QUIZZES.find(q=>q.id===id);current=0;points=0;selected=[];
  $('title').textContent=currentQuiz.title;show('quiz');renderQuestion();
}
function renderQuestion(){
  const q=currentQuiz.questions[current];
  selected=[];
  $('counter').textContent=`Frage ${current+1} von ${currentQuiz.questions.length}`;
  $('bar').style.width=((current)/currentQuiz.questions.length*100)+'%';
  $('question').textContent=q.question;
  $('typeHint').textContent=q.type==='multi'?'Mehrere Antworten möglich':'Eine Antwort auswählen';
  $('options').innerHTML=q.options.map((o,i)=>`
    <label class="option" id="opt${i}">
      <input type="${q.type==='multi'?'checkbox':'radio'}" name="answer"
        value="${escapeAttr(o.id)}" onchange="choose(this)">
      <span><b>${escapeHtml(o.id)}.</b> ${escapeHtml(o.text)}</span>
    </label>`).join('');
  $('nextBtn').disabled=true;
  $('nextBtn').textContent=current===currentQuiz.questions.length-1?'Ergebnis anzeigen':'Weiter';
}
function choose(input){
  const q=currentQuiz.questions[current];
  if(q.type==='multi'){
    selected=[...document.querySelectorAll('input[name=answer]:checked')].map(x=>x.value);
  }else selected=[input.value];
  document.querySelectorAll('.option').forEach((el,i)=>{
    const id=q.options[i].id;el.classList.toggle('selected',selected.includes(id));
  });
  $('nextBtn').disabled=selected.length===0;
}
function nextQuestion(){
  const q=currentQuiz.questions[current];
  const correct=[...q.correct].sort();
  const chosen=[...selected].sort();
  const ok=correct.length===chosen.length && correct.every((x,i)=>x===chosen[i]);
  if(ok) points+=q.points||1;
  current++;
  if(current>=currentQuiz.questions.length){showResult();}else renderQuestion();
}
function showResult(){
  show('result');
  const max=currentQuiz.questions.reduce((s,q)=>s+(q.points||1),0);
  const pct=max?Math.round(points/max*100):0;
  $('resultTitle').textContent=currentQuiz.title+' abgeschlossen';
  $('score').textContent=`${points} / ${max}`;
  $('resultText').textContent=`${pct}% richtig.`;
}
function restart(){startQuiz(currentQuiz.id)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function escapeAttr(s){return escapeHtml(s)}
renderHome();
</script>
</body>
</html>
